name: Order System CI Pipeline

on:
  push:
    branches:
      - "master"
      - "feature/**"
    paths:
      - "messaging-starter/**"
      - "order-service/**"
      - "inventory-service/**"
      - "payment-service/**"
      - "notification-service/**"
      - "investigation-service/**"
      - "pom.xml"

  pull_request:
    branches: [ "master" ]
    paths:
      - "messaging-starter/**"
      - "order-service/**"
      - "inventory-service/**"
      - "payment-service/**"
      - "notification-service/**"
      - "investigation-service/**"
      - "pom.xml"

jobs:
  changes:
    name: Identify changes
    runs-on: ubuntu-latest
    outputs:
      order: ${{ steps.filter.outputs.order }}
      inventory: ${{ steps.filter.outputs.inventory }}
      payment: ${{ steps.filter.outputs.payment }}
      notification: ${{ steps.filter.outputs.notification }}
      investigation: ${{ steps.filter.outputs.investigation }}
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            order:
              - 'order-service/**'
              - 'messaging-starter/**'
            inventory:
              - 'inventory-service/**'
              - 'messaging-starter/**'
            payment:
              - 'payment-service/**'
              - 'messaging-starter/**'
            notification:
              - 'notification-service/**'
              - 'messaging-starter/**'
            investigation:
              - 'investigation-service/**'
              - 'messaging-starter/**'

      - name: Build matrix
        id: set-matrix
        run: |
          matrix=$(jq -nc \
            --arg order "${{ steps.filter.outputs.order }}" \
            --arg payment "${{ steps.filter.outputs.payment }}" \
            --arg inventory "${{ steps.filter.outputs.inventory }}" \
            --arg notification "${{ steps.filter.outputs.notification }}" \
            --arg investigation "${{ steps.filter.outputs.investigation }}" \
            '{include: [
              (if $order=="true" then {service:"order-service"} else empty end),
              (if $payment=="true" then {service:"payment-service"} else empty end),
              (if $inventory=="true" then {service:"inventory-service"} else empty end),
              (if $notification=="true" then {service:"notification-service"} else empty end),
              (if $investigation=="true" then {service:"investigation-service"} else empty end)
            ]}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Computed matrix: $matrix"

  # build services
  build-service:
    name: Build ${{ matrix.service }}
    needs: changes
    if: ${{ needs.changes.outputs.matrix != '{"include":[]}' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    strategy:
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Grant execute permission
        run: chmod +x mvnw

      - name: Package service
        run: ./mvnw -pl ${{ matrix.service }} -am clean package

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ matrix.service }}:${{ github.sha }} \
            -f ${{ matrix.service }}/Dockerfile .

      # ECR publishing is intentionally disabled until the AWS infrastructure
      # exists. Enable it by setting the repository variable
      # ENABLE_ECR_PUBLISHING=true and configuring AWS_ECR_PUBLISH_ROLE_ARN
      # and AWS_REGION.
      - name: Obtain temporary AWS credentials through GitHub OIDC
        if: ${{ github.event_name == 'push' && vars.ENABLE_ECR_PUBLISHING == 'true' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Log in to Amazon ECR
        if: ${{ github.event_name == 'push' && vars.ENABLE_ECR_PUBLISHING == 'true' }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Publish Docker image to Amazon ECR
        if: ${{ github.event_name == 'push' && vars.ENABLE_ECR_PUBLISHING == 'true' }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: microservices-order-system/${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag \
            "${{ matrix.service }}:${IMAGE_TAG}" \
            "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-test-results
          path: ${{ matrix.service }}/target/surefire-reports/*.xml
