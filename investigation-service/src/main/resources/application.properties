# ===============================
# GENERAL CONFIG
# ===============================
spring.application.name=investigation-service
server.port=8085
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# ===============================
# KAFKA CONSUMER
# ===============================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.listener.immediate-stop=true
spring.kafka.consumer.group-id=investigation-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=true
spring.kafka.consumer.properties.spring.json.trusted.packages=org.example.messagingstarter.contracts
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.listener.ack-mode=record

# The Order Service owns and creates order.lifecycle.v1.
spring.kafka.admin.auto-create=false

# ===============================
# HEALTH AND METRICS
# ===============================
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.server.port=8185
management.endpoint.health.group.liveness.include=livenessState
management.metrics.tags.application=${spring.application.name}

logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=WARN
logging.level.org.apache.kafka.clients.NetworkClient=ERROR
logging.level.o.a.k.c.c.internals=OFF
