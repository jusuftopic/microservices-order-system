# ===============================
# GENERAL CONFIG
# ===============================
spring.application.name=investigation-service
server.port=8085
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ===============================
# POSTGRES CONFIG
# ===============================
spring.datasource.url=jdbc:postgresql://${DB_HOST:investigation-db}:${DB_PORT:5432}/${DB_NAME:investigation_db}
spring.datasource.username=${DB_USERNAME:investigation_user}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===============================
# AI EXPLANATION
# ===============================
# The mock remains active until a model-backed generator is configured.
app.ai.generator=${AI_GENERATOR:mock}
app.ai.provider=${AI_PROVIDER:google}
app.ai.model=${AI_MODEL:gemini-2.5-flash-lite}

spring.ai.google.genai.chat.model=${app.ai.model}
spring.ai.google.genai.chat.response-mime-type=application/json
spring.ai.google.genai.chat.temperature=0.0
spring.ai.google.genai.chat.candidate-count=1
spring.ai.google.genai.chat.max-output-tokens=300

# Opt-in local timeline data for testing the Investigation API.
app.mock-data.enabled=${INVESTIGATION_MOCK_DATA_ENABLED:false}

# ===============================
# CONNECTION POOL
# ===============================
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ===============================
# KAFKA CONSUMER
# ===============================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.listener.immediate-stop=true
spring.kafka.consumer.group-id=investigation-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=true
spring.kafka.consumer.properties.spring.json.trusted.packages=org.example.messagingstarter.contracts
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.listener.ack-mode=record
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

app.kafka.topics.partitions=1
app.kafka.topics.replicas=1

# The Order Service creates order.lifecycle.v1; this service creates only its DLT.
spring.kafka.admin.auto-create=true

# ===============================
# HEALTH AND METRICS
# ===============================
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.server.port=8185
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState
management.metrics.tags.application=${spring.application.name}

logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=WARN
logging.level.org.apache.kafka.clients.NetworkClient=ERROR
logging.level.o.a.k.c.c.internals=OFF
